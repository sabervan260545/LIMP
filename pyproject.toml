[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "limp-generator"
version = "1.0.0rc1"
description = "LIMP discriminative and autoregressive antimicrobial-peptide generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4.0",
  "fastapi>=0.104.0",
  "uvicorn>=0.24.0",
  "pydantic>=2.0.0",
  "numpy>=1.24.0",
  "biopython>=1.83",
  "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
packages = ["liup_generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
